<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Babbage AI — offline</title>
  <link rel="icon" href="/babagemed-icon.png" />
  <style>
    html, body { margin: 0; padding: 0; height: 100%; background: #0a0a0c; color: #f4f4f5; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
    .wrap { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; padding: 24px; text-align: center; }
    .dot { width: 12px; height: 12px; border-radius: 50%; background: #ef4444; box-shadow: 0 0 24px #ef4444; margin-bottom: 16px; }
    h1 { font-size: 22px; margin: 0 0 8px; }
    p { color: #a1a1aa; max-width: 360px; margin: 0 0 24px; }
    button { background: #22d3ee; color: #0a0a0c; border: 0; padding: 10px 18px; border-radius: 999px; font-weight: 600; cursor: pointer; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="dot"></div>
    <h1>You're offline</h1>
    <p>Babbage AI needs a network connection to reach the 540 connectors and your chats. We'll bring you back online as soon as we can.</p>
    <button onclick="location.reload()">Try again</button>
  </div>
</body>
</html>
