[package]
name = "babbage-desktop"
version = "0.1.0"
description = "Babbage AI desktop client"
authors = ["Babbage AI"]
license = "Proprietary"
repository = "https://github.com/ceo551/BabageMed-Ai"
edition = "2021"
rust-version = "1.77"

# Default release profile — small binary, good perf. Used by `tauri build`
# when distributing installers (msi/nsis/appimage/deb).
[profile.release]
panic         = "abort"
codegen-units = 1
lto           = "fat"
opt-level     = "s"
strip         = true

# Max-performance profile. Enable with `cargo build --profile release-fast`
# (or `tauri build --profile release-fast`). Trades ~6 MB extra binary
# size for compute-heavy paths (sysinfo polling, hashing, native compress).
[profile.release-fast]
inherits      = "release"
opt-level     = 3
lto           = "fat"
codegen-units = 1

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri        = { version = "2.0", features = ["protocol-asset", "tray-icon", "image-png"] }
serde        = { version = "1.0", features = ["derive"] }
serde_json   = "1.0"
tokio        = { version = "1", features = ["full"] }
thiserror    = "1.0"
log          = "0.4"

# Hardware / system introspection
sysinfo      = { version = "0.32", default-features = false, features = ["system", "disk", "network", "component"] }
num_cpus     = "1.16"
keyring      = { version = "3.6", default-features = false, features = ["windows-native"] }
wgpu         = { version = "22", default-features = false, optional = true }
battery      = { version = "0.7", optional = true }

# Tauri plugin ecosystem
tauri-plugin-shell             = "2.0"
tauri-plugin-fs                = "2.0"
tauri-plugin-dialog            = "2.0"
tauri-plugin-os                = "2.0"
tauri-plugin-process           = "2.0"
tauri-plugin-http              = "2.0"
tauri-plugin-notification      = "2.0"
tauri-plugin-clipboard-manager = "2.0"
tauri-plugin-global-shortcut   = "2.3"
tauri-plugin-opener            = "2.0"
tauri-plugin-store             = "2.0"
tauri-plugin-log               = "2.0"
tauri-plugin-updater           = "2.0"
tauri-plugin-single-instance   = "2.0"
tauri-plugin-deep-link         = "2.0"
tauri-plugin-window-state      = "2.0"
tauri-plugin-autostart         = "2.0"

[features]
default   = []
gpu-probe = ["dep:wgpu"]
battery   = ["dep:battery"]
