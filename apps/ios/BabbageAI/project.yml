# xcodegen definition — run `xcodegen generate` inside this folder to
# reproduce BabbageAI.xcodeproj/project.pbxproj. Storing the project as a
# YAML file (instead of the auto-merged-conflict-magnet that is .pbxproj)
# keeps the iOS scaffold reviewable in PRs.

name: BabbageAI

options:
  bundleIdPrefix: com.babbage.ai
  deploymentTarget:
    iOS: "16.0"
  developmentLanguage: en
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    CURRENT_PROJECT_VERSION: "1"
    MARKETING_VERSION: "0.1.0"
    DEVELOPMENT_TEAM: ""
    ENABLE_PREVIEWS: "YES"

targets:
  BabbageAI:
    type: application
    platform: iOS
    sources:
      - path: BabbageAI
        excludes:
          - "*.plist"
    resources:
      - path: BabbageAI/Assets.xcassets
    info:
      path: BabbageAI/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.babbage.ai.ios
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    entitlements:
      path: BabbageAI/BabbageAI.entitlements
      properties:
        com.apple.developer.associated-domains:
          - applinks:babagemed.com
