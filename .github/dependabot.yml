# Dependabot configuration — keeps npm / Go / Docker / GitHub Actions
# dependencies fresh without manual sweeps. Grouping reduces PR noise.
version: 2
updates:
  # Root workspace npm (apps/web + mcps/* + packages/mcp-base).
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      next-and-react:
        patterns:
          - "next"
          - "react"
          - "react-dom"
          - "@types/react*"
      types:
        patterns:
          - "@types/*"
      dev-tooling:
        patterns:
          - "typescript"
          - "tsx"
          - "eslint*"
          - "prettier*"

  # Backend Go modules. Group all non-major bumps into one PR so the
  # weekly sweep isn't 20 separate dependency PRs.
  - package-ecosystem: "gomod"
    directory: "/backend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      go-minor-patch:
        update-types: ["minor", "patch"]

  # Desktop Tauri shell — Rust crate (apps/desktop/src-tauri). The npm
  # side of apps/desktop is already covered by the root workspace entry
  # above; the Cargo manifest needs its own ecosystem.
  - package-ecosystem: "cargo"
    directory: "/apps/desktop/src-tauri"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      cargo-minor-patch:
        update-types: ["minor", "patch"]

  # GitHub Actions versions. Grouped so an actions/* bump doesn't open
  # a PR per workflow file.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions-all:
        patterns:
          - "*"

  # Docker base image digest pinning. Workflows can opt-in by setting the
  # FROM line to use a tag — Dependabot will then propose digest bumps.
  - package-ecosystem: "docker"
    directory: "/backend"
    schedule:
      interval: "weekly"
  - package-ecosystem: "docker"
    directory: "/apps/web"
    schedule:
      interval: "weekly"
