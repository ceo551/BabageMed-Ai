name: desktop

# Build native Babbage AI installers for Windows, macOS and Linux on each
# push to main + every tag prefixed with `desktop-v`. Tag pushes also draft
# a GitHub release with the binaries attached so the Tauri updater can
# advertise them.

on:
  push:
    branches: [main]
    paths:
      - "apps/desktop/**"
      - "apps/web/**"
      - ".github/workflows/desktop.yml"
    tags:
      - "desktop-v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Don't cancel tag builds — those produce releases — only cancel
  # outdated branch / PR builds.
  group: desktop-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    permissions:
      contents: write  # tauri-action needs this when releaseDraft=true
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-14         # arm64 (Apple Silicon)
            target:   aarch64-apple-darwin
          - platform: macos-13         # x86_64
            target:   x86_64-apple-darwin
          - platform: ubuntu-22.04
            target:   x86_64-unknown-linux-gnu
          - platform: windows-latest
            target:   x86_64-pc-windows-msvc

    runs-on: ${{ matrix.platform }}
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            apps/desktop/package.json
            apps/web/package.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/desktop/src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('apps/desktop/src-tauri/Cargo.toml') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Install Linux build deps
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev libsoup-3.0-dev \
            patchelf

      - name: Install web deps
        working-directory: apps/web
        run: npm ci

      - name: Install desktop deps
        working-directory: apps/desktop
        run: npm ci

      - name: Tauri build
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Code-signing secrets (configured per-org). If missing, the
          # build still produces an unsigned bundle so PR previews work.
          APPLE_CERTIFICATE:           ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD:  ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY:      ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID:                    ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD:              ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID:               ${{ secrets.APPLE_TEAM_ID }}
          WINDOWS_CERTIFICATE:         ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD:${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          TAURI_SIGNING_PRIVATE_KEY:   ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          args: --target ${{ matrix.target }}
          tagName: ${{ startsWith(github.ref, 'refs/tags/desktop-v') && github.ref_name || '' }}
          releaseName: ${{ startsWith(github.ref, 'refs/tags/desktop-v') && format('Desktop {0}', github.ref_name) || '' }}
          releaseDraft: true
          prerelease: false

      - name: Upload artifacts
        if: ${{ !startsWith(github.ref, 'refs/tags/desktop-v') }}
        uses: actions/upload-artifact@v4
        with:
          name: babbage-${{ matrix.target }}
          path: |
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.msi
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.exe
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.dmg
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.AppImage
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.deb
          if-no-files-found: warn
          retention-days: 14
