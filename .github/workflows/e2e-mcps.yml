name: E2E — MCPs

on:
  pull_request:
    paths:
      - "mcps/**"
      - "packages/mcp-base/**"
      - "scripts/mcp-e2e.mjs"
      - "scripts/mcps.manifest.json"
      - "scripts/site-search-patterns.json"
      - "scripts/generate-mcps.mjs"
      - "scripts/write-real-tools.mjs"
      - ".github/workflows/e2e-mcps.yml"
  workflow_dispatch:
    inputs:
      mcps:
        description: "Space-separated MCP ids to test (empty = all)"
        required: false
        default: ""
      shards:
        description: "Number of shards"
        required: false
        default: "8"
  schedule:
    # Nightly run against main so we catch sites that changed their HTML.
    - cron: "23 3 * * *"

permissions:
  contents: read

concurrency:
  group: e2e-mcps-${{ github.ref }}
  cancel-in-progress: true

jobs:
  meta:
    name: Compute test matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.build.outputs.json }}
    steps:
      - uses: actions/checkout@v4
      - id: build
        run: |
          set -e
          input='${{ github.event.inputs.mcps }}'
          shards=${{ github.event.inputs.shards || '8' }}
          if [ -n "$input" ]; then ids="$input"; else ids="$(cat infra/helm/pervagans/mcps-all.txt)"; fi
          json=$(node -e "
            const all = process.argv[1].trim().split(/\s+/).filter(Boolean);
            const n = Number(process.argv[2]);
            const buckets = Array.from({length: n}, () => []);
            all.forEach((id, i) => buckets[i % n].push(id));
            console.log(JSON.stringify(buckets.map((b, i) => ({ shard: i+1, ids: b.join(' ') }))));
          " "$ids" "$shards")
          echo "json=$json" >> "$GITHUB_OUTPUT"

  e2e:
    name: shard ${{ matrix.shard }}
    runs-on: ubuntu-latest
    needs: meta
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include: ${{ fromJson(needs.meta.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - uses: docker/setup-buildx-action@v3

      - name: Pre-build mcp-base layer (shared across all MCPs in this shard)
        run: |
          set -e
          docker buildx build --load \
            --cache-from "type=gha,scope=mcp-base" \
            --cache-to   "type=gha,scope=mcp-base,mode=max" \
            -f packages/mcp-base/Dockerfile.cache - <<'EOF'
          # synthetic Dockerfile that just primes the cache
          FROM node:20-bookworm-slim
          WORKDIR /build
          COPY packages/mcp-base /build
          RUN cd /build && npm install --no-audit --no-fund && npx tsc -p tsconfig.json
          EOF
        continue-on-error: true

      - name: Run E2E across this shard
        env:
          SCRAPER_HEADLESS: "true"
          SCRAPER_RATE_RPS: "2"
        run: |
          set -e
          ids="${{ matrix.ids }}"
          mkdir -p /tmp/e2e
          ok=0; fail=0; skip=0
          report=/tmp/e2e/report.txt
          : > "$report"
          for id in $ids; do
            echo "::group::e2e $id"
            set +e
            node scripts/mcp-e2e.mjs "$id" 2>&1 | tee "/tmp/e2e/$id.log"
            rc=${PIPESTATUS[0]}
            set -e
            case "$rc" in
              0) ok=$((ok+1));  echo "PASS $id" >> "$report" ;;
              2) skip=$((skip+1)); echo "SKIP $id" >> "$report" ;;
              *) fail=$((fail+1)); echo "FAIL $id" >> "$report" ;;
            esac
            echo "::endgroup::"
          done
          echo ""
          echo "shard ${{ matrix.shard }}: $ok pass, $skip skip, $fail fail"
          echo "::notice::shard ${{ matrix.shard }}: $ok pass, $skip skip, $fail fail"
          # A shard is green if 0 fails. Skips (credential-gated MCPs +
          # outbound-blocked ones) don't break the build.
          test "$fail" -eq 0

      - name: Upload shard report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report-shard-${{ matrix.shard }}
          path: /tmp/e2e/
          retention-days: 7

  summary:
    name: E2E summary
    runs-on: ubuntu-latest
    needs: e2e
    if: always()
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/reports
          pattern: e2e-report-shard-*
      - name: Tally
        run: |
          cat /tmp/reports/*/report.txt | sort | uniq -c | sort -rn
          {
            echo "## MCP E2E results"
            echo ""
            echo '```'
            cat /tmp/reports/*/report.txt | sort | uniq -c | sort -rn
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
