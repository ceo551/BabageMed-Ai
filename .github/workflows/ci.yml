name: CI

on:
  pull_request:
  push:
    branches: [main, develop, "claude/**"]

# Default least-privilege token. Individual jobs that need more should
# request `permissions:` at the job level.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─── Lint + typecheck ─────────────────────────────────────────────────
  backend:
    name: Backend (Go)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.23"
          cache-dependency-path: backend/go.sum
      - name: go build
        working-directory: backend
        run: go build ./...
      - name: go vet
        working-directory: backend
        run: go vet ./...
      - name: gofmt
        working-directory: backend
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::These files aren't gofmt'd:"
            echo "$unformatted"
            exit 1
          fi
      - name: go test
        working-directory: backend
        env:
          DATABASE_URL: ""   # internal/db gracefully skips when empty
        run: go test ./... -short -count=1

  frontend:
    name: Frontend (Next.js)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: package-lock.json
      - run: npm install --no-audit --no-fund
      - name: type-check (apps/web)
        run: |
          cd apps/web
          npx tsc --noEmit
      - name: lint (apps/web)
        # Catches dead code / unused imports — added in the 40-agent
        # audit pass when the cleanup uncovered ~360 LoC of orphan card
        # components shipping in the bundle. --max-warnings=0 so a new
        # warning becomes a PR-blocking failure instead of slow rot.
        run: |
          cd apps/web
          npx next lint --max-warnings=0
      - name: unit tests (apps/web)
        run: |
          cd apps/web
          npm test

  # ─── Helm chart lint ──────────────────────────────────────────────────
  helm:
    name: Helm chart lint + template
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
        with:
          version: v3.16.3
      - name: helm lint
        run: helm lint infra/helm/pervagans
      - name: helm template (smoke render)
        run: |
          helm template pervagans infra/helm/pervagans \
            --set image.registry=ghcr.io/ci \
            --set ingress.host=ci.example \
            --set monitoring.serviceMonitor.enabled=true \
            --set networkPolicy.enabled=true \
            --set backend.autoscaling.enabled=true > /tmp/rendered.yaml
          echo "rendered $(wc -l < /tmp/rendered.yaml) lines"
          # Catch the most common YAML breakage early.
          python3 -c "import yaml,sys; [yaml.safe_load(d) for d in yaml.safe_load_all(open('/tmp/rendered.yaml'))]"

