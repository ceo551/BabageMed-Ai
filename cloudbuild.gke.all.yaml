# Cloud Build config for the FULL stack: backend + frontend + all 262 MCP images.
# Cloud Build allows at most 100 build steps per build, so we do NOT emit
# one step per image (that was 264 steps and the API rejected the
# file outright). Instead: 3 steps — backend, frontend, and a single loop
# step that builds every MCP image with bounded parallelism (xargs -P6).
# The top-level images: list makes Cloud Build push them all at the end.
# Generated from infra/helm/babbage/mcps-all.txt.
timeout: 7200s
options:
  # E2_HIGHCPU_8 (8 vCPU / 8 GB). The MCP loop is bounded to 6 concurrent
  # docker builds (~6×~0.8 GB) and runs AFTER backend+frontend finish, so
  # peak memory stays under 8 GB. Larger machine types are quota-denied on
  # fresh projects. Local docker layer cache is shared across MCP builds
  # (all FROM the same node + mcp-base base), so only the first build is slow.
  machineType: E2_HIGHCPU_8
  diskSizeGb: 200
  logging: CLOUD_LOGGING_ONLY

substitutions:
  _REGION: us-central1
  _REPO: babbage
  _TAG: v20

images:
  - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/backend:${_TAG}"
  - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/frontend:${_TAG}"
  - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/mcp-pubmed:${_TAG}"
  - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/mcp-notion:${_TAG}"
