steps:
  - id: backend
    name: gcr.io/cloud-builders/docker
    waitFor: ["-"]
    args: [build, -f, backend/Dockerfile, -t, "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/backend:${_TAG}", .]

  - id: frontend
    name: gcr.io/cloud-builders/docker
    waitFor: ["-"]
    dir: apps/web
    args: [build, -f, Dockerfile, -t, "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/frontend:${_TAG}", .]

  - id: mcps
    name: gcr.io/cloud-builders/docker
    waitFor: ["backend", "frontend"]
    entrypoint: bash
    env:
      - "REG=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}"
      - "TAG=${_TAG}"
    # NB: shell $ must be escaped as $$ in Cloud Build YAML — Cloud Build
    # does substitution-expansion on single-$ tokens first (and would
    # reject $REG/$TAG as unknown substitutions), collapsing $$ -> $ before
    # the script reaches bash.
    args:
      - -c
      - |
        set -euo pipefail
        echo "building $$(wc -w < infra/helm/babbage/mcps-all.txt) MCP images with -P6 parallelism"
        tr ' ' '\n' < infra/helm/babbage/mcps-all.txt | grep -v '^$$' | xargs -P 6 -I {} bash -c 'docker build -q -f "mcps/{}/Dockerfile" -t "$$REG/mcp-{}:$$TAG" .'
