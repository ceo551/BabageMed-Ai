# Cloud Build config for the stack: backend + frontend.
# (The self-hosted MCP images + their bounded-parallelism build loop were
# removed — the app now uses REMOTE MCP connectors, no per-server images.)
timeout: 1800s
options:
  machineType: E2_HIGHCPU_8
  diskSizeGb: 100
  logging: CLOUD_LOGGING_ONLY

substitutions:
  _REGION: us-central1
  _REPO: pervagans
  _TAG: v20

images:
  - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/backend:${_TAG}"
  - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/frontend:${_TAG}"

steps:
  - id: backend
    name: gcr.io/cloud-builders/docker
    waitFor: ["-"]
    args: [build, -f, backend/Dockerfile, -t, "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/backend:${_TAG}", .]

  - id: frontend
    name: gcr.io/cloud-builders/docker
    waitFor: ["-"]
    dir: apps/web
    args: [build, -f, Dockerfile, -t, "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/frontend:${_TAG}", .]
