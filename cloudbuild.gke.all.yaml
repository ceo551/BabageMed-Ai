# Cloud Build config for the FULL stack: backend + frontend + all 262 MCP images.
# Cloud Build allows at most 100 build steps per build, so we do NOT emit
# one step per image (that was 264 steps and the API rejected the
# file outright). Instead: 3 steps — backend, frontend, and a single loop
# step that builds every MCP image with bounded parallelism (xargs -P6).
# The top-level images: list makes Cloud Build push them all at the end.
# Generated from infra/helm/pervagans/mcps-all.txt.
timeout: 7200s
options:
  # E2_HIGHCPU_8 (8 vCPU / 8 GB). The MCP loop is bounded to 6 concurrent
  # docker builds (~6×~0.8 GB) and runs AFTER backend+frontend finish, so
  # peak memory stays under 8 GB. Larger machine types are quota-denied on
  # fresh projects. Local docker layer cache is shared across MCP builds
  # (all FROM the same node + mcp-base base), so only the first build is slow.
  machineType: E2_HIGHCPU_8
  diskSizeGb: 200
  logging: CLOUD_LOGGING_ONLY

substitutions:
  _REGION: us-central1
  _REPO: pervagans
  _TAG: v20

images:
  - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/backend:${_TAG}"
  - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/frontend:${_TAG}"
  - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/mcp-pubmed:${_TAG}"
  - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/mcp-notion:${_TAG}"
  - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/mcp-slack:${_TAG}"
  - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/mcp-linkedin:${_TAG}"
  - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/mcp-gmail:${_TAG}"
  - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/mcp-gcalendar:${_TAG}"
  - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/mcp-github:${_TAG}"
  - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/mcp-gdrive:${_TAG}"
  - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/mcp-ms365:${_TAG}"
  - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/mcp-facebook-pages:${_TAG}"
  - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/mcp-x-twitter:${_TAG}"

steps:
  - id: backend
    name: gcr.io/cloud-builders/docker
    waitFor: ["-"]
    args: [build, -f, backend/Dockerfile, -t, "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/backend:${_TAG}", .]

  - id: frontend
    name: gcr.io/cloud-builders/docker
    waitFor: ["-"]
    dir: apps/web
    args: [build, -f, Dockerfile, -t, "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/frontend:${_TAG}", .]

  - id: mcps
    name: gcr.io/cloud-builders/docker
    waitFor: ["backend", "frontend"]
    entrypoint: bash
    env:
      - "REG=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}"
      - "TAG=${_TAG}"
    # NB: shell $ must be escaped as $$ in Cloud Build YAML — Cloud Build
    # does substitution-expansion on single-$ tokens first (and would
    # reject $REG/$TAG as unknown substitutions), collapsing $$ -> $ before
    # the script reaches bash.
    args:
      - -c
      - |
        set -euo pipefail
        echo "building $$(wc -w < infra/helm/pervagans/mcps-all.txt) MCP images with -P6 parallelism"
        tr ' ' '\n' < infra/helm/pervagans/mcps-all.txt | grep -v '^$$' | xargs -P 6 -I {} bash -c 'docker build -q -f "mcps/{}/Dockerfile" -t "$$REG/mcp-{}:$$TAG" .'
