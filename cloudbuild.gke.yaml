timeout: 3600s
options:
  machineType: E2_HIGHCPU_8
  diskSizeGb: 100
  logging: CLOUD_LOGGING_ONLY

substitutions:
  _REGION: us-central1
  _REPO: babbage
  _TAG: v22

# Deploy subset that fits the project's 2-node quota: backend + frontend +
# 8 light API survivor MCPs (post-prune; the medical MCPs were removed).
images:
  - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/backend:${_TAG}"
  - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/frontend:${_TAG}"
  - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/mcp-pubmed:${_TAG}"
  - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/mcp-notion:${_TAG}"
  - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/mcp-slack:${_TAG}"
  - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/mcp-github:${_TAG}"
  - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/mcp-gmail:${_TAG}"
  - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/mcp-gcalendar:${_TAG}"
  - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/mcp-linkedin:${_TAG}"
  - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/mcp-huggingface:${_TAG}"

steps:
  - id: backend
    name: gcr.io/cloud-builders/docker
    waitFor: ["-"]
    args:
      - build
      - -f
      - backend/Dockerfile
      - -t
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/backend:${_TAG}
      - .

  - id: frontend
    name: gcr.io/cloud-builders/docker
    waitFor: ["-"]
    dir: apps/web
    args:
      - build
      - -f
      - Dockerfile
      - -t
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/frontend:${_TAG}
      - .

  - id: mcp-pubmed
    name: gcr.io/cloud-builders/docker
    waitFor: ["-"]
    args: [build, -f, mcps/pubmed/Dockerfile, -t, "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/mcp-pubmed:${_TAG}", .]

  - id: mcp-notion
    name: gcr.io/cloud-builders/docker
    waitFor: ["-"]
    args: [build, -f, mcps/notion/Dockerfile, -t, "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/mcp-notion:${_TAG}", .]

  - id: mcp-slack
    name: gcr.io/cloud-builders/docker
    waitFor: ["-"]
    args: [build, -f, mcps/slack/Dockerfile, -t, "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/mcp-slack:${_TAG}", .]

  - id: mcp-github
    name: gcr.io/cloud-builders/docker
    waitFor: ["-"]
    args: [build, -f, mcps/github/Dockerfile, -t, "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/mcp-github:${_TAG}", .]

  - id: mcp-gmail
    name: gcr.io/cloud-builders/docker
    waitFor: ["-"]
    args: [build, -f, mcps/gmail/Dockerfile, -t, "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/mcp-gmail:${_TAG}", .]

  - id: mcp-gcalendar
    name: gcr.io/cloud-builders/docker
    waitFor: ["-"]
    args: [build, -f, mcps/gcalendar/Dockerfile, -t, "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/mcp-gcalendar:${_TAG}", .]

  - id: mcp-linkedin
    name: gcr.io/cloud-builders/docker
    waitFor: ["-"]
    args: [build, -f, mcps/linkedin/Dockerfile, -t, "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/mcp-linkedin:${_TAG}", .]

  - id: mcp-huggingface
    name: gcr.io/cloud-builders/docker
    waitFor: ["-"]
    args: [build, -f, mcps/huggingface/Dockerfile, -t, "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/mcp-huggingface:${_TAG}", .]
