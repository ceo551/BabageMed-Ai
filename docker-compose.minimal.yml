name: babagemed
# Minimal stack — frontend + backend + the 12 most-useful API-driven MCPs.
# No Playwright images (saves ~70 GB), no auth-required servers (need keys).
# Bring up with:
#   docker compose -f docker-compose.yml -f docker-compose.minimal.yml up -d --build
services:
  mcp-pubmed:
    build: { context: ., dockerfile: mcps/pubmed/Dockerfile }
    image: babagemed/mcp-pubmed:latest
    env_file: .env
    environment: { HTTP_ONLY: "1" }
    ports: ["6101:6101"]
    restart: unless-stopped
    networks: [babagemed]

  mcp-icd10:
    build: { context: ., dockerfile: mcps/icd10/Dockerfile }
    image: babagemed/mcp-icd10:latest
