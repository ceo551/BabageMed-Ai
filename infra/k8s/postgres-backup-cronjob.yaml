# Nightly logical backup of the in-cluster Postgres StatefulSet.
# pg_dump → gzip → ReadWriteOnce PVC, retaining 7 days. This is a stop-gap
# durability measure for the bundled Postgres; for full production move to a
# managed database (Cloud SQL) with PITR and drop this CronJob.
#
# Apply: kubectl apply -f infra/k8s/postgres-backup-cronjob.yaml
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pervagans-postgres-backups
  namespace: pervagans
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: standard-rwo
  resources:
    requests:
      storage: 10Gi
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: pervagans-postgres-backup
  namespace: pervagans
spec:
  schedule: "0 2 * * *"            # daily 02:00 UTC
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 3600
      template:
        spec:
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            runAsUser: 70           # postgres uid in postgres:16-alpine
            runAsGroup: 70
            fsGroup: 70
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: pgdump
              image: postgres:16-alpine
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -euo pipefail
                  TS=$(date +%Y%m%d-%H%M%S)
                  OUT="/backups/pervagans-$TS.sql.gz"
                  echo "dumping $POSTGRES_DB -> $OUT"
                  pg_dump -h pervagans-postgres -U "$POSTGRES_USER" -d "$POSTGRES_DB" | gzip > "$OUT"
                  echo "pruning dumps older than 7 days"
                  find /backups -name 'pervagans-*.sql.gz' -mtime +7 -delete
                  ls -lh /backups
              env:
                - name: PGPASSWORD
                  valueFrom: { secretKeyRef: { name: pervagans-env, key: POSTGRES_PASSWORD } }
                - name: POSTGRES_USER
                  valueFrom: { secretKeyRef: { name: pervagans-env, key: POSTGRES_USER } }
                - name: POSTGRES_DB
                  valueFrom: { secretKeyRef: { name: pervagans-env, key: POSTGRES_DB } }
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: false
                capabilities:
                  drop: ["ALL"]
              resources:
                requests: { cpu: 100m, memory: 128Mi }
                limits:   { cpu: 500m, memory: 256Mi }
              volumeMounts:
                - name: backups
                  mountPath: /backups
          volumes:
            - name: backups
              persistentVolumeClaim:
                claimName: pervagans-postgres-backups
