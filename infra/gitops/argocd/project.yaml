# ArgoCD AppProject — scopes what the Babbage application can deploy.
# Apply once: `kubectl apply -f infra/gitops/argocd/project.yaml -n argocd`
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: babbage
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  description: Babbage AI — Next.js + Go + Postgres + 262 MCPs
  sourceRepos:
    # Pin to your fork / private mirror in production.
    - https://github.com/ceo551/babbage-ai
    - https://github.com/ceo551/babbage-ai.git
  destinations:
    - namespace: babbage
      server: https://kubernetes.default.svc
    - namespace: babbage-staging
      server: https://kubernetes.default.svc
  clusterResourceWhitelist:
    - group: "*"
      kind: "Namespace"
    - group: "rbac.authorization.k8s.io"
      kind: "*"
  namespaceResourceWhitelist:
    - group: "*"
      kind: "*"
  orphanedResources:
    warn: true
