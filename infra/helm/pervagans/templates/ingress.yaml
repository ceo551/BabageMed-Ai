{{- if .Values.ingress.enabled -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}-ingress
  labels: {{- include "pervagans.labels" . | nindent 4 }}
  annotations:
    {{- include "pervagans.ingressAnnotations" . | nindent 4 }}
spec:
  ingressClassName: {{ include "pervagans.ingressClass" . | quote }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts: [ {{ .Values.ingress.host | quote }} ]
      {{- if .Values.ingress.tls.existingSecret }}
      secretName: {{ .Values.ingress.tls.existingSecret | quote }}
      {{- else }}
      secretName: {{ printf "%s-tls" .Release.Name | quote }}
      {{- end }}
  {{- end }}
  rules:
      # When ingress.host is empty the rule is host-less (catch-all), so the
      # same Cloud LB serves the apex AND www (and any host pointed at its IP).
    - http:
        paths:
          # All paths — including /api/backend/* — go to the Next.js frontend.
          # The frontend has an App Router route at app/api/backend/[...path]/route.ts
          # that proxies to the Go backend (reading BACKEND_URL per-request, so it
          # picks up the k8s-injected env). Routing /api/backend directly at the
          # backend service here would skip that proxy and arrive with the wrong
          # path prefix (404 for every call).
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ .Release.Name }}-frontend
                port: { number: {{ .Values.frontend.service.port }} }
      {{- if .Values.ingress.host }}
      host: {{ .Values.ingress.host | quote }}
      {{- end }}
{{- end -}}
