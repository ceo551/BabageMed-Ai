{{- if .Values.frontend.enabled -}}
{{- if eq .Values.cloud "gke" }}
apiVersion: cloud.google.com/v1
kind: BackendConfig
metadata:
  name: {{ .Release.Name }}-frontend
  labels:
    {{- include "pervagans.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
spec:
  # The GCE load-balancer health check must hit a path that returns 200
  # WITHOUT a session. The app gate (apps/web/middleware.ts) 307-redirects
  # "/" to "/login" for unauthenticated requests, and GCE health checks
  # treat 3xx as UNHEALTHY (unlike kube probes, which follow the redirect).
  # /login is public and returns 200 on both old and new pods, so the NEG
  # health check stays green across the rollout instead of wedging the
  # readiness gate (cloud.google.com/load-balancer-neg-ready).
  healthCheck:
    type: HTTP
    requestPath: /login
    port: 3000
---
{{- end }}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-frontend
  {{- if eq .Values.cloud "gke" }}
  annotations:
    cloud.google.com/backend-config: '{"default":"{{ .Release.Name }}-frontend"}'
  {{- end }}
  labels:
    {{- include "pervagans.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
spec:
  type: {{ .Values.frontend.service.type }}
  selector:
    app.kubernetes.io/name: pervagans
    app.kubernetes.io/component: frontend
  ports:
    - name: http
      port: {{ .Values.frontend.service.port }}
      targetPort: 3000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-frontend
  labels:
    {{- include "pervagans.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
spec:
  replicas: {{ .Values.frontend.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: pervagans
      app.kubernetes.io/component: frontend
  template:
    metadata:
      annotations:
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
      labels:
        app.kubernetes.io/name: pervagans
        app.kubernetes.io/component: frontend
    spec:
      serviceAccountName: {{ include "pervagans.serviceAccountName" . }}
      # Spread replicas across nodes so the PDB actually buys
      # availability (see backend.yaml for the rationale).
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: pervagans
              app.kubernetes.io/component: frontend
      securityContext: {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: frontend
          image: {{ include "pervagans.image" (dict "registry" .Values.image.registry "name" "frontend" "tag" .Values.image.tag) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: BACKEND_URL
              value: "http://{{ .Release.Name }}-backend:{{ .Values.backend.service.port }}"
            - name: NEXT_PUBLIC_API
              value: "/api/backend"
          # Probe /login, not / — the auth gate 307-redirects / to /login for
          # the (cookie-less) probe. kube probes follow the redirect so / would
          # still pass, but the GCE NEG health check does not; keeping both on
          # the same public 200 path keeps them consistent. /login is a static
          # prerendered page, so it answers well inside the timeout.
          readinessProbe:
            httpGet: { path: /login, port: http }
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
          # A liveness probe was missing — a hung Next.js process (e.g. an
          # unhandled promise rejection in the route handler that takes down
          # the event loop) would keep the pod marked Ready forever. Long
          # period + high failureThreshold avoids killing pods that are just
          # slow on the cold path (route handler proxying the 416-MCP /health).
          livenessProbe:
            httpGet: { path: /login, port: http }
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          resources: {{- toYaml .Values.frontend.resources | nindent 12 }}
          securityContext: {{- toYaml .Values.securityContext | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end -}}
