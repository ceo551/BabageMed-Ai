# AKS-specific values overlay. Use with:
#   helm install pervagans ./infra/helm/pervagans \
#     -n pervagans --create-namespace \
#     -f infra/helm/pervagans/values-aks.yaml \
#     --set image.registry=youracr.azurecr.io \
#     --set ingress.host=app.yourdomain.com \
#     --set ingress.tls.issuer=letsencrypt-prod
cloud: aks

ingress:
  className: "nginx"          # or "azure-application-gateway" if AGIC is installed
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/proxy-body-size: "20m"
    # cert-manager.io/cluster-issuer: letsencrypt-prod

postgres:
  internal: false
  externalUrl: ""   # Azure DB for PostgreSQL flexible server DSN

# AKS default storage class is "default" (managed disks). Use "managed-premium" for SSD.
# postgres:
#   storage:
#     storageClass: "managed-premium"
