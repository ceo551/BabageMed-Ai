# Throw-away values used by the AKS test deploy on rg-babagemed-test.
# Sized for 1 system pod + 4 user pods (D8s_v3 / E8as_v4 / D8as_v4 / F8as_v6 / E8s_v3)
# = 40 vCPU, ~208 GB total. Hosts the full 416-MCP preset.
cloud: aks

image:
  registry: acrbabagemedtest5583.azurecr.io
  # Always re-pull on pod start. We push to :latest from every az acr build,
  # so IfNotPresent leaves nodes stuck on whatever digest they first cached
  # (= the wall of "my new changes never deployed" bugs earlier in this
  # session). Always is the right policy for a mutable tag like :latest.
  pullPolicy: Always
  tag: latest

frontend:
  enabled: true
  replicas: 1
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits:   { cpu: 1000m, memory: 768Mi }

backend:
  enabled: true
  replicas: 1
  resources:
    requests: { cpu: 200m, memory: 256Mi }
    limits:   { cpu: 1500m, memory: 1Gi }

postgres:
  internal: true
  storage:
    size: 10Gi
    storageClass: managed-csi
  resources:
    requests: { cpu: 200m, memory: 384Mi }
    limits:   { cpu: 1000m, memory: 1Gi }

# All 416 MCPs. Trim resources hard so they fit on 5 nodes.
mcps:
  preset: all
  resourcesApi:
    requests: { cpu: 15m, memory: 80Mi }
    limits:   { cpu: 250m, memory: 192Mi }
  resourcesScrape:
    requests: { cpu: 30m, memory: 160Mi }
    limits:   { cpu: 500m, memory: 384Mi }

ingress:
  enabled: true
  className: nginx
  # Production hostname — A record points at the AKS ingress LB IP
  # (20.203.126.171). On Cloudflare with Proxied=ON, so end-users
  # actually hit Cloudflare's edge first; Cloudflare reaches Azure
  # over Microsoft's backbone (which works even though direct
  # public-internet → UAE-North LB times out from most networks).
  host: ai.babagemed.com
  tls:
    # TLS terminated at Cloudflare (Universal SSL on the edge), not at
    # ingress-nginx. Cloudflare SSL/TLS mode = "Flexible": user↔CF over
    # HTTPS, CF↔origin over HTTP. Saves us cert-manager + Let's Encrypt
    # while keeping the browser padlock. To go full end-to-end TLS:
    # flip this back to true + put a real cert in babagemed-tls AND set
    # Cloudflare to "Full (strict)".
    enabled: false
    issuer: ""

secrets:
  # No real API keys — chat will 401 but everything else (auth, MCP browser, tester) works
  anthropicApiKey: ""
  googleApiKey: ""
  openaiApiKey: ""
  postgresPassword: "babagemed-test-only-not-prod"
  postgresUser: babagemed
  postgresDb: babagemed
  bootstrapAdminEmail: "ceo@babagemed.com"

serviceAccount:
  create: true
  name: ""

# GCP / Vertex AI via Workload Identity Federation. When enabled, the backend
# pod runs as babagemed-backend-sa, picks up a projected OIDC token from AKS,
# exchanges it via STS for an impersonated bearer on vertexServiceAccount,
# and routes Gemini calls to {location}-aiplatform.googleapis.com instead of
# the AI Studio key endpoint. Disable to fall back to GOOGLE_API_KEY.
redis:
  enabled: true
  maxmemory: "128mb"

gcp:
  enabled: true
  project: "starlit-braid-497012-q5"
  projectNumber: "36958314605"
  location: "us-central1"
  # Anthropic models live in a different region set than Gemini; us-east5 is
  # the canonical region for Claude on Vertex AI Marketplace. Each Claude
  # model (Opus 4.7, Opus 4.6, Sonnet, Haiku) is its own Marketplace product
  # — subscribe per model at console.cloud.google.com/vertex-ai/publishers/anthropic
  anthropicLocation: "us-east5"
  wifPool: "aks-pool"
  wifProvider: "aks-provider"
  vertexServiceAccount: "babagemed-vertex@starlit-braid-497012-q5.iam.gserviceaccount.com"
