apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    # Public Let's Encrypt directory. For staging (much higher rate limits but
    # untrusted root) use:
    #   server: https://acme-staging-v02.api.letsencrypt.org/directory
    server: https://acme-v02.api.letsencrypt.org/directory
    email: ceo@babagemed.com
    privateKeySecretRef:
      name: letsencrypt-prod-account-key
    # HTTP-01: cert-manager provisions a temporary Ingress under the hostname
    # being verified; the AKS ingress-nginx controller serves the ACME
    # challenge over the same LB IP the rest of the app uses.
    solvers:
      - http01:
          ingress:
            class: nginx
