{{- if .Values.postgres.internal -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-postgres
  labels:
    {{- include "babagemed.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
spec:
  type: ClusterIP
  clusterIP: None
  selector:
    app.kubernetes.io/name: babagemed
    app.kubernetes.io/component: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Release.Name }}-postgres
  labels:
    {{- include "babagemed.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
spec:
  serviceName: {{ .Release.Name }}-postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: babagemed
      app.kubernetes.io/component: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: babagemed
        app.kubernetes.io/component: postgres
    spec:
      # Pod-level securityContext. The upstream postgres image runs as
      # uid 999 (the "postgres" user); fsGroup matches so the PVC
      # mount at /var/lib/postgresql/data is writable. Without this,
      # PSP/PSA "restricted" admission rejects the StatefulSet on any
      # hardened cluster (GKE Autopilot, AKS Pod-Security restricted).
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: postgres
          image: {{ .Values.postgres.image }}
          # Raise max_connections above the stock 100. The backend pool
          # defaults to DB_MAX_CONNS per pod × backend replicas (+ HPA),
          # which can exceed 100 and cause "sorry, too many connections"
          # CrashLoops under the 262-MCP fan-out load. 200 leaves comfortable
          # headroom for 2–10 backend replicas at DB_MAX_CONNS=20 each plus
          # superuser/admin slots. (postgres-alpine's entrypoint prepends
          # "postgres" when the first arg starts with "-".)
          args: ["-c", "max_connections={{ .Values.postgres.maxConnections | default 200 }}"]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
            # readOnlyRootFilesystem can't be true for postgres — the
            # entrypoint writes /var/run/postgresql + /tmp at startup.
            # Use an emptyDir below if you need to tighten further.
          env:
            - name: POSTGRES_USER
              valueFrom: { secretKeyRef: { name: {{ .Values.mcps.envFromSecret }}, key: POSTGRES_USER } }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: {{ .Values.mcps.envFromSecret }}, key: POSTGRES_PASSWORD } }
            - name: POSTGRES_DB
              valueFrom: { secretKeyRef: { name: {{ .Values.mcps.envFromSecret }}, key: POSTGRES_DB } }
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - name: postgres
              containerPort: 5432
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          # Probes run via `sh -c` so $POSTGRES_USER actually expands.
          # kubelet does NOT do $(VAR_NAME) substitution inside
          # probe.exec.command (unlike the container's main command/args),
          # so the previous `["pg_isready", "-U", "$(POSTGRES_USER)"]`
          # was handing pg_isready the literal string "$(POSTGRES_USER)"
          # as a username → "no attempt" / exit 3 ("invalid parameter")
          # and the pod sat 0/1 forever. -h 127.0.0.1 also forces TCP
          # instead of the Unix socket at /var/run/postgresql (which the
          # postgres-alpine image creates for its packaged uid 70, not
          # the uid 999 we run as).
          readinessProbe:
            exec: { command: ["sh", "-c", "pg_isready -h 127.0.0.1 -U \"$POSTGRES_USER\""] }
            initialDelaySeconds: 5
            periodSeconds: 10
          # Liveness probe — without it a wedged Postgres process stays
          # "ready" forever and connected backend pods all stall. Generous
          # timeouts so a slow query doesn't trigger a false restart and
          # cascade-fail. failureThreshold high so 3 successive slow
          # pg_isready calls before the SIGKILL.
          livenessProbe:
            exec: { command: ["sh", "-c", "pg_isready -h 127.0.0.1 -U \"$POSTGRES_USER\""] }
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 6
          resources: {{- toYaml .Values.postgres.resources | nindent 12 }}
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: [ ReadWriteOnce ]
        {{- if .Values.postgres.storage.storageClass }}
        storageClassName: {{ .Values.postgres.storage.storageClass | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.postgres.storage.size }}
{{- end -}}
