{{- if .Values.monitoring.serviceMonitor.enabled }}
{{/*
  Two ServiceMonitors — one for the backend, one that fans out across
  every MCP Service. Both use the "http" port name so prometheus-operator
  can scrape /metrics on the correct port without us listing 416 of them.
*/}}
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ .Release.Name }}-backend
  labels:
    {{- include "babagemed.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
    {{- with .Values.monitoring.serviceMonitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: babagemed
      app.kubernetes.io/component: backend
      app.kubernetes.io/instance: {{ .Release.Name }}
  namespaceSelector:
    matchNames: [ {{ .Release.Namespace }} ]
  endpoints:
    - port: http
      path: /metrics
      interval: {{ .Values.monitoring.serviceMonitor.interval }}
      scrapeTimeout: {{ .Values.monitoring.serviceMonitor.scrapeTimeout }}
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ .Release.Name }}-mcps
  labels:
    {{- include "babagemed.labels" . | nindent 4 }}
    app.kubernetes.io/component: mcp
    {{- with .Values.monitoring.serviceMonitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: babagemed
      app.kubernetes.io/component: mcp
  namespaceSelector:
    matchNames: [ {{ .Release.Namespace }} ]
  endpoints:
    - port: http
      path: /metrics
      interval: {{ .Values.monitoring.serviceMonitor.interval }}
      scrapeTimeout: {{ .Values.monitoring.serviceMonitor.scrapeTimeout }}
      # Drop the verbose Node.js heap/eventloop bits if you want — uncomment:
      # metricRelabelings:
      #   - sourceLabels: [__name__]
      #     regex: 'mcp_nodejs_.*'
      #     action: drop
{{- end }}

{{- if .Values.monitoring.prometheusRule.enabled }}
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ .Release.Name }}-alerts
  labels:
    {{- include "babagemed.labels" . | nindent 4 }}
    {{- with .Values.monitoring.prometheusRule.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  groups:
    - name: babagemed.mcps
      rules:
        - alert: McpDown
          expr: up{job=~".*mcps.*"} == 0
          for: 2m
          labels: { severity: warning }
          annotations:
            summary: "MCP {{`{{ $labels.mcp_id }}`}} is unreachable"
            description: "Prometheus failed to scrape /metrics on this MCP for 2 minutes."
        - alert: McpHighErrorRate
          expr: |
            sum by (mcp_id, tool) (rate(mcp_tool_calls_total{outcome="error"}[5m]))
              /
            sum by (mcp_id, tool) (rate(mcp_tool_calls_total[5m]))
            > 0.2
          for: 5m
          labels: { severity: warning }
          annotations:
            summary: "MCP {{`{{ $labels.mcp_id }}`}} tool {{`{{ $labels.tool }}`}} >20% errors"
        - alert: McpSlowP95
          expr: |
            histogram_quantile(0.95,
              sum by (mcp_id, tool, le) (rate(mcp_tool_duration_seconds_bucket[5m]))
            ) > 5
          for: 10m
          labels: { severity: info }
          annotations:
            summary: "MCP {{`{{ $labels.mcp_id }}`}} {{`{{ $labels.tool }}`}} p95 > 5s"
    - name: babagemed.backend
      rules:
        - alert: BackendDown
          expr: up{job=~".*backend.*"} == 0
          for: 1m
          labels: { severity: critical }
          annotations: { summary: "Backend is down" }
        - alert: BackendHigh5xx
          expr: |
            sum(rate(backend_http_requests_total{status=~"5.."}[5m]))
              /
            sum(rate(backend_http_requests_total[5m])) > 0.05
          for: 5m
          labels: { severity: warning }
          annotations: { summary: "Backend 5xx rate >5%" }
        - alert: LLMHighErrorRate
          expr: |
            sum by (provider, model) (rate(backend_llm_calls_total{outcome="error"}[5m]))
              /
            sum by (provider, model) (rate(backend_llm_calls_total[5m])) > 0.1
          for: 5m
          labels: { severity: warning }
          annotations:
            summary: "LLM {{`{{ $labels.provider }}/{{ $labels.model }}`}} >10% errors"
{{- end }}
