{{- if .Values.backend.enabled -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-backend
  labels:
    {{- include "babagemed.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  type: {{ .Values.backend.service.type }}
  selector:
    app.kubernetes.io/name: babagemed
    app.kubernetes.io/component: backend
  ports:
    - name: http
      port: {{ .Values.backend.service.port }}
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-backend
  labels:
    {{- include "babagemed.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  replicas: {{ .Values.backend.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: babagemed
      app.kubernetes.io/component: backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: babagemed
        app.kubernetes.io/component: backend
    spec:
      # When gcp.enabled, the pod runs as babagemed-backend-sa so the WIF
      # provider's attribute-condition matches (namespace=babagemed,
      # sa=babagemed-backend-sa) and the projected token can be exchanged for
      # an impersonated bearer on the Vertex SA.
      serviceAccountName: {{ if .Values.gcp.enabled }}babagemed-backend-sa{{ else }}{{ include "babagemed.serviceAccountName" . }}{{ end }}
      securityContext: {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- $desktopCM := and .Values.desktopUpdates.enabled .Values.desktopUpdates.configMap.name -}}
      {{- if or .Values.gcp.enabled $desktopCM }}
      volumes:
        {{- if .Values.gcp.enabled }}
        # Projected k8s SA token, signed by the AKS OIDC issuer, scoped to
        # the WIF provider's audience. Rotates automatically every <1h.
        - name: gcp-token
          projected:
            sources:
              - serviceAccountToken:
                  path: gcp-token
                  audience: "//iam.googleapis.com/projects/{{ .Values.gcp.projectNumber }}/locations/global/workloadIdentityPools/{{ .Values.gcp.wifPool }}/providers/{{ .Values.gcp.wifProvider }}"
                  expirationSeconds: 3600
        # external-account.json — see templates/gcp-wif.yaml. Tells the
        # Google ADC library how to exchange the projected token for a
        # bearer that impersonates the Vertex SA.
        - name: gcp-wif-config
          configMap:
            name: babagemed-gcp-wif
            items:
              - key: external-account.json
                path: external-account.json
        {{- end }}
        {{- if $desktopCM }}
        # Tauri update manifest, mounted read-only. Operators can update it
        # without a chart upgrade: `kubectl create configmap NAME --from-file=KEY=path
        # --dry-run=client -o yaml | kubectl apply -f -`. The backend's
        # 5-min in-memory cache plus kubelet's configmap refresh (~minute)
        # means rollouts take a couple of minutes — by design.
        - name: desktop-updates
          configMap:
            name: {{ .Values.desktopUpdates.configMap.name }}
            items:
              - key: {{ .Values.desktopUpdates.configMap.key | default "latest.json" }}
                path: {{ .Values.desktopUpdates.configMap.key | default "latest.json" }}
        {{- end }}
      {{- end }}
      containers:
        - name: backend
          image: {{ include "babagemed.image" (dict "registry" .Values.image.registry "name" "backend" "tag" .Values.image.tag) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          {{- if or .Values.gcp.enabled $desktopCM }}
          volumeMounts:
            {{- if .Values.gcp.enabled }}
            - name: gcp-token
              mountPath: /var/run/secrets/tokens
              readOnly: true
            - name: gcp-wif-config
              mountPath: /var/secrets/google
              readOnly: true
            {{- end }}
            {{- if $desktopCM }}
            - name: desktop-updates
              mountPath: {{ .Values.desktopUpdates.configMap.mountPath | default "/etc/babagemed/desktop-updates" }}
              readOnly: true
            {{- end }}
          {{- end }}
          env:
            - name: PORT
              value: "8080"
            - name: MCP_HOST_OVERRIDE
              value: {{ .Values.backend.mcpHostOverride | quote }}
            - name: OTEL_SERVICE_NAME
              value: "babagemed-backend"
            - name: K8S_POD_NAME
              valueFrom: { fieldRef: { fieldPath: metadata.name } }
            {{- if .Values.gcp.enabled }}
            - name: GOOGLE_APPLICATION_CREDENTIALS
              value: /var/secrets/google/external-account.json
            - name: GOOGLE_CLOUD_PROJECT
              value: {{ .Values.gcp.project | quote }}
            - name: GOOGLE_CLOUD_LOCATION
              value: {{ .Values.gcp.location | quote }}
            # Anthropic-on-Vertex runs in a separate region (us-east5 is the
            # canonical one for Claude). Falls back to the in-code default if
            # the value is empty.
            - name: VERTEX_ANTHROPIC_LOCATION
              value: {{ .Values.gcp.anthropicLocation | default "us-east5" | quote }}
            {{- end }}
            {{- if .Values.redis.enabled }}
            # In-cluster Redis (see templates/redis.yaml). REDIS_PASSWORD
            # is injected from the Secret because it's randomly generated
            # at chart install time and stable across upgrades. The
            # backend's cache package URL-encodes the password.
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.mcps.envFromSecret | default "babagemed-env" }}
                  key: REDIS_PASSWORD
            - name: REDIS_URL
              value: "redis://:$(REDIS_PASSWORD)@{{ .Release.Name }}-redis:6379/0"
            {{- end }}
            {{- if $desktopCM }}
            # Wired here (not in the Secret) so the path stays in sync
            # with the volumeMount above when an operator overrides
            # configMap.mountPath / configMap.key.
            - name: DESKTOP_UPDATES_MANIFEST_PATH
              value: {{ printf "%s/%s" (.Values.desktopUpdates.configMap.mountPath | default "/etc/babagemed/desktop-updates") (.Values.desktopUpdates.configMap.key | default "latest.json") | quote }}
            {{- end }}
          envFrom:
            - secretRef:
                name: {{ .Values.mcps.envFromSecret }}
          # /health pings every registered MCP — with 416 of them the response
          # can take >1s during startup, which flaps the default probe timeouts.
          # Give it generous timeouts so the backend doesn't restart-loop while
          # the MCP fleet is still coming up.
          readinessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 5
            periodSeconds: 15
            timeoutSeconds: 15
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 30
            periodSeconds: 60
            timeoutSeconds: 30
            failureThreshold: 3
          resources: {{- toYaml .Values.backend.resources | nindent 12 }}
          securityContext: {{- toYaml .Values.securityContext | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity: {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end -}}
