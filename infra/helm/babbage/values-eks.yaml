# EKS-specific values overlay. Use with:
#   helm install babbage ./infra/helm/babbage \
#     -n babbage --create-namespace \
#     -f infra/helm/babbage/values-eks.yaml \
#     --set image.registry=123456789.dkr.ecr.us-east-1.amazonaws.com \
#     --set ingress.host=app.yourdomain.com
cloud: eks

ingress:
  className: "alb"            # requires AWS Load Balancer Controller installed
  annotations:
    kubernetes.io/ingress.class: "alb"
    alb.ingress.kubernetes.io/scheme: "internet-facing"
    alb.ingress.kubernetes.io/target-type: "ip"
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80},{"HTTPS":443}]'
    alb.ingress.kubernetes.io/ssl-redirect: "443"
    # alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:us-east-1:…

postgres:
  internal: false
  externalUrl: ""   # RDS / Aurora DSN

# EKS default StorageClass varies. Use "gp3" with the EBS CSI driver for SSD.
postgres:
  storage:
    storageClass: "gp3"

# Workload identity (IRSA) — set the role ARN to give pods permissions.
serviceAccount:
  annotations:
    eks.amazonaws.com/role-arn: ""
