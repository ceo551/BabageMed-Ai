{{- if not .Values.secrets.existingSecret -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.mcps.envFromSecret | default "babbage-env" }}
  labels: {{- include "babbage.labels" . | nindent 4 }}
type: Opaque
stringData:
  # Database
  DATABASE_URL: {{ include "babbage.databaseUrl" . | quote }}
  POSTGRES_USER: {{ .Values.secrets.postgresUser | quote }}
  # Refuse to install with the placeholder default. Operators MUST supply
  # a real password via --set secrets.postgresPassword=... or, better, an
  # existingSecret in production. This stops a fresh `helm install` from
  # shipping a known credential.
  {{- $pw := .Values.secrets.postgresPassword | default "" }}
  {{- if or (eq $pw "") (eq $pw "change-me-in-prod") }}
  {{- fail "secrets.postgresPassword must be set to a real value (the default placeholder is rejected)" }}
  {{- end }}
  POSTGRES_PASSWORD: {{ $pw | quote }}
  POSTGRES_DB: {{ .Values.secrets.postgresDb | quote }}

  # LLMs
  ANTHROPIC_API_KEY: {{ .Values.secrets.anthropicApiKey | quote }}
  GOOGLE_API_KEY: {{ .Values.secrets.googleApiKey | quote }}
  OPENAI_API_KEY: {{ .Values.secrets.openaiApiKey | quote }}

  # MCP API keys
  NCBI_API_KEY: {{ .Values.secrets.ncbiApiKey | quote }}
  NCBI_TOOL: {{ .Values.secrets.ncbiTool | default "BabbageAI" | quote }}
  NCBI_EMAIL: {{ .Values.secrets.ncbiEmail | quote }}
  OPENFDA_API_KEY: {{ .Values.secrets.openfdaApiKey | quote }}
  SOCRATA_APP_TOKEN: {{ .Values.secrets.socrataAppToken | quote }}
  WHO_ICD_CLIENT_ID: {{ .Values.secrets.whoIcdClientId | default "" | quote }}
  WHO_ICD_CLIENT_SECRET: {{ .Values.secrets.whoIcdClientSecret | default "" | quote }}
  NHS_API_KEY: {{ .Values.secrets.nhsApiKey | default "" | quote }}
  HF_API_TOKEN: {{ .Values.secrets.hfApiToken | default "" | quote }}
  CROSSREF_MAILTO: {{ .Values.secrets.crossrefMailto | default "ceo@babagemed.com" | quote }}
  NOTION_TOKEN: {{ .Values.secrets.notionToken | default "" | quote }}
  SLACK_BOT_TOKEN: {{ .Values.secrets.slackBotToken | default "" | quote }}
  SLACK_TEAM_ID: {{ .Values.secrets.slackTeamId | default "" | quote }}
  GITHUB_TOKEN: {{ .Values.secrets.githubToken | default "" | quote }}
  KAGGLE_USERNAME: {{ .Values.secrets.kaggleUsername | default "" | quote }}
  KAGGLE_KEY: {{ .Values.secrets.kaggleKey | default "" | quote }}
  LINKEDIN_ACCESS_TOKEN: {{ .Values.secrets.linkedinAccessToken | default "" | quote }}
  HOSTINGER_API_TOKEN: {{ .Values.secrets.hostingerApiToken | default "" | quote }}
  GODADDY_API_KEY: {{ .Values.secrets.godaddyApiKey | default "" | quote }}
  GODADDY_API_SECRET: {{ .Values.secrets.godaddyApiSecret | default "" | quote }}
  GAMMA_SESSION_COOKIE: {{ .Values.secrets.gammaSessionCookie | default "" | quote }}
  # Google OAuth (gmail, gcalendar, gdrive MCPs)
  GOOGLE_CLIENT_ID: {{ .Values.secrets.googleClientId | default "" | quote }}
  GOOGLE_CLIENT_SECRET: {{ .Values.secrets.googleClientSecret | default "" | quote }}
  GOOGLE_REFRESH_TOKEN: {{ .Values.secrets.googleRefreshToken | default "" | quote }}
  # Microsoft 365 (outlook, teams MCPs)
  MS365_CLIENT_ID: {{ .Values.secrets.ms365ClientId | default "" | quote }}
  MS365_CLIENT_SECRET: {{ .Values.secrets.ms365ClientSecret | default "" | quote }}
  MS365_TENANT_ID: {{ .Values.secrets.ms365TenantId | default "" | quote }}
  MS365_REFRESH_TOKEN: {{ .Values.secrets.ms365RefreshToken | default "" | quote }}

  # Payments — Paddle
  PADDLE_ENV: {{ .Values.secrets.paddleEnv | default "sandbox" | quote }}
  PADDLE_API_KEY: {{ .Values.secrets.paddleApiKey | quote }}
  PADDLE_CLIENT_TOKEN: {{ .Values.secrets.paddleClientToken | quote }}
  PADDLE_WEBHOOK_SECRET: {{ .Values.secrets.paddleWebhookSecret | quote }}
  PADDLE_PRICE_GO_MONTHLY: {{ .Values.secrets.paddlePriceGoMonthly | quote }}
  PADDLE_PRICE_PLUS_MONTHLY: {{ .Values.secrets.paddlePricePlusMonthly | quote }}
  PADDLE_PRICE_PRO_MONTHLY: {{ .Values.secrets.paddlePriceProMonthly | quote }}
  PADDLE_PRICE_MAX_MONTHLY: {{ .Values.secrets.paddlePriceMaxMonthly | quote }}

  # Admin
  BOOTSTRAP_ADMIN_EMAIL: {{ .Values.secrets.bootstrapAdminEmail | quote }}

  # Scraper
  SCRAPER_USER_AGENT: {{ .Values.secrets.scraperUserAgent | quote }}
  SCRAPER_RATE_RPS: {{ .Values.secrets.scraperRateRps | quote }}
  SCRAPER_TIMEOUT_MS: {{ .Values.secrets.scraperTimeoutMs | default "30000" | quote }}
  SCRAPER_HEADLESS: {{ .Values.secrets.scraperHeadless | default "true" | quote }}
  SCRAPER_CACHE_TTL_SEC: {{ .Values.secrets.scraperCacheTtlSec | default "86400" | quote }}
  SCRAPER_PROXY_URL: {{ .Values.secrets.scraperProxyUrl | quote }}

  # Desktop auto-updater. The Tauri client polls
  # /api/desktop/update/{target}/{arch}/{current_version}; the backend
  # picks whichever source is set, with priority MANIFEST > MANIFEST_URL
  # > MANIFEST_PATH. When configMap.name is set in values.yaml,
  # MANIFEST_PATH is filled in by the backend Deployment instead of here
  # (it lives next to the volumeMount).
  {{- with .Values.desktopUpdates }}
  DESKTOP_UPDATES_DISABLED: {{ ternary "1" "" (or (not .enabled) .disabled) | quote }}
  DESKTOP_UPDATES_MANIFEST: {{ .manifest | quote }}
  DESKTOP_UPDATES_MANIFEST_URL: {{ .manifestUrl | quote }}
  {{- end }}

  # Redis password — resolved via babbage.redisPassword so this Secret
  # (babbage-env) and the MCP Secret (babbage-env-mcp) share ONE value.
  # The helper reuses the existing value on upgrade and caches a freshly
  # generated one on the render context so both Secrets match on a fresh
  # install (previously each generated its own → MCP Redis AUTH failed).
  REDIS_PASSWORD: {{ include "babbage.redisPassword" . | quote }}

  # MFA secret encryption key — 32 raw random bytes, base64-encoded.
  # mfa.New parses base64 first then falls back to raw, so either form
  # the operator overrides with works. Auto-generated on first install
  # and preserved across upgrades via the same `lookup` pattern as
  # REDIS_PASSWORD; rotating it would invalidate every existing TOTP
  # enrolment (users would have to re-enrol their authenticator apps).
  # Operators can pin a value via secrets.mfaEncryptionKey if they want
  # cross-cluster portability (e.g. blue/green deployments).
  {{- $existing := lookup "v1" "Secret" .Release.Namespace (.Values.mcps.envFromSecret | default "babbage-env") }}
  {{- if .Values.secrets.mfaEncryptionKey }}
  MFA_ENCRYPTION_KEY: {{ .Values.secrets.mfaEncryptionKey | quote }}
  {{- else if and $existing (index $existing.data "MFA_ENCRYPTION_KEY") }}
  MFA_ENCRYPTION_KEY: {{ index $existing.data "MFA_ENCRYPTION_KEY" | b64dec | quote }}
  {{- else }}
  MFA_ENCRYPTION_KEY: {{ randBytes 32 | quote }}
  {{- end }}

  # Backend
  PUBLIC_BASE_URL: {{ printf "https://%s" .Values.ingress.host | quote }}

  # OpenTelemetry — backend + every MCP read these. Empty values disable tracing.
  {{- if .Values.tracing.enabled }}
  OTEL_TRACING_ENABLED: "true"
  {{- if eq .Values.tracing.protocol "grpc" }}
  OTEL_EXPORTER_OTLP_ENDPOINT: {{ printf "%s://%s" (ternary "http" "https" .Values.tracing.insecure) .Values.tracing.endpoint | quote }}
  OTEL_EXPORTER_OTLP_PROTOCOL: "grpc"
  {{- else }}
  OTEL_EXPORTER_OTLP_ENDPOINT: {{ printf "%s://%s" (ternary "http" "https" .Values.tracing.insecure) .Values.tracing.endpoint | quote }}
  OTEL_EXPORTER_OTLP_PROTOCOL: "http/protobuf"
  {{- end }}
  OTEL_TRACES_SAMPLER: "parentbased_traceidratio"
  OTEL_TRACES_SAMPLER_ARG: {{ .Values.tracing.samplingRate | quote }}
  OTEL_RESOURCE_ATTRIBUTES: {{ printf "deployment.environment=%s,service.namespace=babbage" .Release.Namespace | quote }}
  {{- end }}
{{- end -}}
