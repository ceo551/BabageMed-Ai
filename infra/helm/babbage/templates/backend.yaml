{{- if .Values.backend.enabled -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-backend
  labels:
    {{- include "babbage.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  type: {{ .Values.backend.service.type }}
  selector:
    app.kubernetes.io/name: babbage
    app.kubernetes.io/component: backend
  ports:
    - name: http
      port: {{ .Values.backend.service.port }}
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-backend
  labels:
    {{- include "babbage.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  replicas: {{ .Values.backend.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: babbage
      app.kubernetes.io/component: backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: babbage
        app.kubernetes.io/component: backend
    spec:
      # When gcp.enabled, the pod runs as babbage-backend-sa so the WIF
      # provider's attribute-condition matches (namespace=babbage,
      # sa=babbage-backend-sa) and the projected token can be exchanged for
      # an impersonated bearer on the Vertex SA.
      serviceAccountName: {{ if .Values.gcp.enabled }}babbage-backend-sa{{ else }}{{ include "babbage.serviceAccountName" . }}{{ end }}
      # Graceful drain window. main.go's srv.Shutdown gets 25s, so we
      # give the pod 35s before SIGKILL: 10s slack accommodates the
      # CNI / service-mesh / kube-proxy time to deregister the pod from
      # the load-balancer pool, then 25s for in-flight chat-stream SSE
      # answers to finish their final token. Without this, the default
      # 30s grace period sometimes raced the load-balancer deregister
      # and forwarded a request to a pod mid-shutdown.
      terminationGracePeriodSeconds: 35
      # Spread replicas across failure domains so the PDB
      # (templates/pdb.yaml) actually buys availability — without
      # topology spread, two replicas can both schedule on the same
      # node and a single node failure takes down 100% of backends
      # despite the maxUnavailable: 50% PDB. We prefer (not require)
      # spreading so single-node dev clusters still install cleanly.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: babbage
              app.kubernetes.io/component: backend
      # Backend is distroless/static → USER nonroot = uid 65532, so it needs
      # a numeric runAsUser of 65532 (the global default is 1000, matching the
      # node-based frontend/MCP images). deepCopy keeps the merge from mutating
      # the shared .Values map (which would leak 65532 onto frontend/MCPs).
      securityContext: {{- toYaml (merge (dict "runAsUser" 65532) (deepCopy .Values.podSecurityContext)) | nindent 8 }}
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- $desktopCM := and .Values.desktopUpdates.enabled .Values.desktopUpdates.configMap.name -}}
      {{- if or .Values.gcp.enabled $desktopCM }}
      volumes:
        {{- if .Values.gcp.enabled }}
        # Projected k8s SA token, signed by the AKS OIDC issuer, scoped to
        # the WIF provider's audience. Rotates automatically every <1h.
        - name: gcp-token
          projected:
            sources:
              - serviceAccountToken:
                  path: gcp-token
                  audience: "//iam.googleapis.com/projects/{{ .Values.gcp.projectNumber }}/locations/global/workloadIdentityPools/{{ .Values.gcp.wifPool }}/providers/{{ .Values.gcp.wifProvider }}"
                  expirationSeconds: 3600
        # external-account.json — see templates/gcp-wif.yaml. Tells the
        # Google ADC library how to exchange the projected token for a
        # bearer that impersonates the Vertex SA.
        - name: gcp-wif-config
          configMap:
            name: babbage-gcp-wif
            items:
              - key: external-account.json
                path: external-account.json
        {{- end }}
        {{- if $desktopCM }}
        # Tauri update manifest, mounted read-only. Operators can update it
        # without a chart upgrade: `kubectl create configmap NAME --from-file=KEY=path
        # --dry-run=client -o yaml | kubectl apply -f -`. The backend's
        # 5-min in-memory cache plus kubelet's configmap refresh (~minute)
        # means rollouts take a couple of minutes — by design.
        - name: desktop-updates
          configMap:
            name: {{ .Values.desktopUpdates.configMap.name }}
            items:
              - key: {{ .Values.desktopUpdates.configMap.key | default "latest.json" }}
                path: {{ .Values.desktopUpdates.configMap.key | default "latest.json" }}
        {{- end }}
      {{- end }}
      containers:
        - name: backend
          image: {{ include "babbage.image" (dict "registry" .Values.image.registry "name" "backend" "tag" .Values.image.tag) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          {{- if or .Values.gcp.enabled $desktopCM }}
          volumeMounts:
            {{- if .Values.gcp.enabled }}
            - name: gcp-token
              mountPath: /var/run/secrets/tokens
              readOnly: true
            - name: gcp-wif-config
              mountPath: /var/secrets/google
              readOnly: true
            {{- end }}
            {{- if $desktopCM }}
            - name: desktop-updates
              mountPath: {{ .Values.desktopUpdates.configMap.mountPath | default "/etc/babbage/desktop-updates" }}
              readOnly: true
            {{- end }}
          {{- end }}
          env:
            - name: PORT
              value: "8080"
            # Cap the pgx pool per pod. Default in code is 50; with multiple
            # backend replicas (and HPA) that overruns Postgres'
            # max_connections and CrashLoops on "too many connections".
            # 20/pod × a handful of replicas stays well under the 200 the
            # postgres StatefulSet is configured for.
            - name: DB_MAX_CONNS
              value: {{ .Values.backend.dbMaxConns | default 20 | quote }}
            - name: MCP_HOST_OVERRIDE
              value: {{ .Values.backend.mcpHostOverride | quote }}
            - name: OTEL_SERVICE_NAME
              value: "babbage-backend"
            - name: K8S_POD_NAME
              valueFrom: { fieldRef: { fieldPath: metadata.name } }
            {{- if .Values.gcp.enabled }}
            - name: GOOGLE_APPLICATION_CREDENTIALS
              value: /var/secrets/google/external-account.json
            - name: GOOGLE_CLOUD_PROJECT
              value: {{ .Values.gcp.project | quote }}
            - name: GOOGLE_CLOUD_LOCATION
              value: {{ .Values.gcp.location | quote }}
            # Anthropic-on-Vertex runs in a separate region (us-east5 is the
            # canonical one for Claude). Falls back to the in-code default if
            # the value is empty.
            - name: VERTEX_ANTHROPIC_LOCATION
              value: {{ .Values.gcp.anthropicLocation | default "us-east5" | quote }}
            {{- end }}
            {{- if .Values.redis.enabled }}
            # In-cluster Redis (see templates/redis.yaml). REDIS_PASSWORD
            # is injected from the Secret because it's randomly generated
            # at chart install time and stable across upgrades. The
            # backend's cache package URL-encodes the password.
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.mcps.envFromSecret | default "babbage-env" }}
                  key: REDIS_PASSWORD
            - name: REDIS_URL
              value: "redis://:$(REDIS_PASSWORD)@{{ .Release.Name }}-redis:6379/0"
            {{- end }}
            {{- if $desktopCM }}
            # Wired here (not in the Secret) so the path stays in sync
            # with the volumeMount above when an operator overrides
            # configMap.mountPath / configMap.key.
            - name: DESKTOP_UPDATES_MANIFEST_PATH
              value: {{ printf "%s/%s" (.Values.desktopUpdates.configMap.mountPath | default "/etc/babbage/desktop-updates") (.Values.desktopUpdates.configMap.key | default "latest.json") | quote }}
            {{- end }}
          envFrom:
            - secretRef:
                name: {{ .Values.mcps.envFromSecret }}
          # Probes target the cheap /livez (process-only) + /readyz (lightweight
          # readiness) endpoints, not /health — /health fans out to every MCP and
          # one slow upstream would flap the liveness probe and SIGKILL the pod.
          # /health stays available for dashboards/ops at the same port.
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            initialDelaySeconds: 3
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /livez, port: http }
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 5
          resources: {{- toYaml .Values.backend.resources | nindent 12 }}
          securityContext: {{- toYaml (merge (dict "runAsUser" 65532) (deepCopy .Values.securityContext)) | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity: {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end -}}
