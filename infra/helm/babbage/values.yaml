# Default values for the Babbage AI Helm chart.
# Override with --values myvalues.yaml or --set key=value.
#
# Quick start (any of GKE / AKS / EKS):
#   helm install babbage ./infra/helm/babbage \
#     --namespace babbage --create-namespace \
#     --set image.registry=ghcr.io/your-org \
#     --set ingress.host=app.yourdomain.com \
#     --set secrets.anthropicApiKey=sk-ant-...

# ─── Image registry ───────────────────────────────────────────────────────
# All images live under <registry>/<repo>:<tag>. Push them before installing.
# See infra/k8s/build-and-push.sh for a helper.
image:
  registry: ghcr.io/ceo551                        # change to your registry
  pullPolicy: IfNotPresent
  pullSecrets: []                                 # e.g. [ {name: regcred} ]
  tag: latest

# ─── Cloud target — picks sensible Ingress + StorageClass defaults ──────
# Valid: "gke" | "aks" | "eks" | "generic"
cloud: generic

# ─── Frontend ─────────────────────────────────────────────────────────────
frontend:
  enabled: true
  replicas: 2
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits:   { cpu: 1000m, memory: 768Mi }
  service:
    type: ClusterIP
    port: 3000
  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70
  # PodDisruptionBudget — protects against simultaneous eviction during
  # node drain / autoscaler scale-down. minAvailable wins over
  # maxUnavailable when both are set. Disable for single-replica dev
  # installs (minAvailable:1 with 1 replica blocks all drains).
  pdb:
    enabled: true
    maxUnavailable: "50%"
    # minAvailable: 1

# ─── Backend ──────────────────────────────────────────────────────────────
backend:
  enabled: true
  replicas: 2
  # Sized for the 262-MCP fan-out workload — the backend gathers from all
  # selected MCPs in parallel per chat turn (8 concurrent goroutines per
  # request, ~64 KB per HTTP response buffer). 256Mi requests OOM-killed
  # the pod under modest load; 512Mi gives headroom for the streaming
  # Anthropic response + Redis cache + MCP buffers without padding the
  # cluster floor unnecessarily.
  resources:
    requests: { cpu: 500m, memory: 512Mi }
    limits:   { cpu: 2000m, memory: 2Gi }
  service:
    type: ClusterIP
    port: 8080
  # MCP_HOST_OVERRIDE empty → backend uses mcp-<id> DNS names, which are the
  # k8s Service names this chart creates. Leave alone.
  mcpHostOverride: ""
  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 20
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80
  # PodDisruptionBudget — see frontend.pdb for rationale. Backend is
  # the critical path (chat-stream SSE), so we want at least one
  # replica up at all times during a rolling node drain.
  pdb:
    enabled: true
    maxUnavailable: "50%"
    # minAvailable: 1

# ─── Postgres ─────────────────────────────────────────────────────────────
# Two modes:
#   1) internal=true  — chart provisions a StatefulSet + PVC (fine for dev/test
#                       and small prod). NOT recommended for serious prod —
#                       use the cloud-managed one.
#   2) internal=false — bring your own DSN via externalUrl. Recommended for
#                       prod: Cloud SQL (GCP), Azure DB for PostgreSQL,
#                       AWS RDS / Aurora.
postgres:
  internal: true
  # When internal=true:
  image: postgres:16-alpine
  storage:
    size: 20Gi
    # storageClass: empty → cluster default (works on GKE/AKS/EKS).
    # Override with: gp3 (EKS), standard-rwo (GKE), managed-premium (AKS), etc.
    storageClass: ""
  # Sized for production-style chat history workload. 512Mi was undersized
  # for the working set; bumping shared_buffers + work_mem requires more
  # memory headroom. For real prod, use postgres.internal=false and point
  # externalUrl at Cloud SQL / RDS / managed Postgres — the in-cluster
  # StatefulSet is a SPOF (single replica, no failover, no PITR).
  resources:
    requests: { cpu: 500m, memory: 1Gi }
    limits:   { cpu: 2000m, memory: 4Gi }
  # When internal=false, set externalUrl to the full DSN.
  externalUrl: ""   # e.g. postgres://user:pass@10.0.0.5:5432/babbage?sslmode=require
  # sslmode used when internal=true. Default "disable" because the
  # bundled StatefulSet doesn't ship a server certificate AND the
  # NetworkPolicy (templates/networkpolicy.yaml) isolates backend↔
  # postgres traffic to a single namespace pod-pod path. If you
  # disable NetworkPolicy on a multi-tenant cluster, override to
  # "require" and add a postgres-tls init container with cert-manager.
  internalSslMode: disable

# ─── MCP servers ──────────────────────────────────────────────────────────
# 262 MCPs would be too heavy for most clusters. Pick what you need.
# The "default" preset is the same 47 the laptop/KVM2 stack runs.
# Override to deploy more or fewer:
#   --set 'mcps.enabled={pubmed,fda,clinicaltrials}'   # 3 only
#   --set mcps.preset=all                              # all 262 (heavy)
mcps:
  preset: default
  # When preset != "custom", `enabled` is overridden by the preset list below.
  enabled: []
  # Resource limits applied to every MCP unless overridden per-MCP.
  resourcesApi:
    requests: { cpu: 50m, memory: 128Mi }
    limits:   { cpu: 500m, memory: 256Mi }
  resourcesScrape:
    requests: { cpu: 100m, memory: 256Mi }
    limits:   { cpu: 1000m, memory: 512Mi }
  # All MCPs read the shared .env via the same Secret as the backend.
  envFromSecret: babbage-env
  # Per-MCP autoscaling. Off by default — most clusters won't have metrics
  # for each of 262 deployments. Turn on selectively.
  autoscaling:
    enabled: false
    api:
      minReplicas: 1
      maxReplicas: 5
      targetCPUUtilizationPercentage: 75
    scrape:
      minReplicas: 1
      maxReplicas: 3
      targetCPUUtilizationPercentage: 80

# ─── Tracing (OpenTelemetry) ──────────────────────────────────────────────
# When enabled, every backend + MCP container gets OTEL_* env vars pointing
# at the collector endpoint. The SDK is dormant unless these are present,
# so off-by-default keeps cold-start fast.
#
# Typical setup: install the OpenTelemetry Collector (or Grafana Alloy /
# Tempo Distributor) in the same cluster and point endpoint at its OTLP
# service. Examples:
#   GKE   → opentelemetry-collector.observability.svc.cluster.local:4317
#   AKS   → otel-collector.monitoring.svc.cluster.local:4317
#   EKS   → otel-collector.adot.svc.cluster.local:4317
#   Grafana Tempo (distributor):
#         tempo-distributor.monitoring.svc.cluster.local:4317
tracing:
  enabled: false
  protocol: grpc          # "grpc" → :4317, "http/protobuf" → :4318
  endpoint: ""            # e.g. otel-collector.observability.svc.cluster.local:4317
  insecure: true          # in-cluster traffic; flip for cross-cluster TLS
  samplingRate: "1.0"     # 0.0..1.0; 0.1 = 10% sampled

# ─── Logs (Loki via Promtail / Grafana Alloy) ─────────────────────────────
# This chart doesn't install Loki — point your Promtail/Alloy at the same
# cluster. The values below produce a ConfigMap with a ready-to-use
# scrape-config snippet that parses the JSON logs the backend and MCPs
# emit and extracts trace_id / span_id / mcp_id as Loki labels so logs
# can be linked to traces in Grafana.
logging:
  promtailSnippet:
    enabled: false
    # ConfigMap name + key the snippet lands in. Mount it into your
    # Promtail/Alloy deployment as needed.
    configMap: babbage-promtail-snippet

# ─── Monitoring (Prometheus + Grafana) ────────────────────────────────────
# Requires the prometheus-operator (kube-prometheus-stack) CRDs to be
# installed for ServiceMonitor + PrometheusRule. The Grafana dashboard is
# picked up by Grafana's sidecar via a configurable label.
monitoring:
  serviceMonitor:
    enabled: false
    interval: 30s
    scrapeTimeout: 10s
    # Extra labels Prometheus selects on (kube-prometheus-stack uses
    # `release: kube-prometheus-stack` by default).
    labels:
      release: kube-prometheus-stack
  prometheusRule:
    enabled: false
    labels:
      release: kube-prometheus-stack
  grafanaDashboard:
    enabled: false
    # kube-prometheus-stack expects { grafana_dashboard: "1" }; bitnami expects
    # { grafana_dashboard: babbage-overview }. Defaults to the former.
    label: grafana_dashboard
    labelValue: "1"

# ─── NetworkPolicy ────────────────────────────────────────────────────────
# Zero-trust namespace: default-deny + per-component allow rules.
# Frontend ← ingress controller only; Backend ← frontend + ingress;
# Postgres ← backend only; MCPs ← backend only (no MCP↔MCP traffic).
# Requires a CNI that enforces NetworkPolicy (Calico, Cilium,
# GKE Dataplane V2, Azure CNI Overlay+Calico, AWS VPC CNI with
# enforcement enabled).
networkPolicy:
  enabled: false
  # Namespaces hosting the ingress controller (ingress-nginx, gce, alb…).
  # The frontend and backend pods accept ingress from pods in these namespaces.
  ingressFromNamespaces:
    - ingress-nginx
    - kube-system

# ─── Ingress ──────────────────────────────────────────────────────────────
# className guidance:
#   gke      → "gce"              (Google Cloud Load Balancer)
#   aks      → "nginx" or "azure-application-gateway"
#   eks      → "alb" (AWS Load Balancer Controller) or "nginx"
#   generic  → "nginx" (assumes ingress-nginx is installed)
ingress:
  enabled: true
  host: app.babbage.local
  className: ""                # filled in from cloud target if empty
  annotations: {}              # filled in from cloud target if empty
  tls:
    enabled: true
    # Pick ONE strategy:
    issuer: ""                 # cert-manager ClusterIssuer name (e.g. letsencrypt-prod)
    existingSecret: ""         # pre-existing TLS secret (mutually exclusive with issuer)

# ─── Redis (MCP-search cache) ────────────────────────────────────────────
# Tiny in-cluster Redis used to memoise MCP search results for ~5 minutes
# (set in the backend cache wrapper). Opt-in: when disabled, the backend's
# cache layer no-ops and every gather() hits upstream.
redis:
  enabled: false
  maxmemory: "128mb"

# ─── GCP / Vertex AI (Workload Identity Federation) ──────────────────────
# Opt-in. When enabled, the backend pod is bound to babbage-backend-sa,
# mounts an OIDC-signed projected token, and exchanges it for an impersonated
# bearer on vertexServiceAccount — no static SA JSON key in the cluster.
# See infra/helm/babbage/templates/gcp-wif.yaml for the external_account
# config that the Go google.FindDefaultCredentials picks up.
#
# Set up on GCP side (one-time):
#   1. gcloud iam workload-identity-pools create <wifPool> --location=global
#   2. gcloud iam workload-identity-pools providers create-oidc <wifProvider>
#      --workload-identity-pool=<wifPool>
#      --issuer-uri=<AKS oidc issuer>
#      --attribute-mapping="google.subject=assertion.sub,..."
#      --attribute-condition="namespace == 'babbage' && sa == 'babbage-backend-sa'"
#   3. gcloud iam service-accounts add-iam-policy-binding <vertexServiceAccount>
#      --role=roles/iam.workloadIdentityUser
#      --member="principal://iam.googleapis.com/projects/<num>/locations/global/workloadIdentityPools/<wifPool>/subject/system:serviceaccount:babbage:babbage-backend-sa"
gcp:
  enabled: false
  project: ""
  projectNumber: ""
  location: "us-central1"
  wifPool: "aks-pool"
  wifProvider: "aks-provider"
  vertexServiceAccount: ""

# ─── Secrets ──────────────────────────────────────────────────────────────
# In production, manage these with sealed-secrets, External Secrets Operator,
# GCP Secret Manager, AWS Secrets Manager, or Azure Key Vault — not values.yaml.
# For dev/test, set them here and the chart will create a Secret.
#
# If existingSecret is non-empty, the chart will NOT create one, and will
# assume that secret contains the same keys (see templates/secret.yaml).
secrets:
  existingSecret: ""
  # MFA secret encryption key (32 random bytes, base64-encoded).
  # Leave empty → the secret template auto-generates one on first
  # install and preserves it across upgrades via a `lookup` of the
  # existing Secret. Set explicitly if you need cross-cluster
  # portability (blue/green, disaster recovery). Rotating invalidates
  # every existing TOTP enrolment so users must re-enrol.
  mfaEncryptionKey: ""
  # Core
  anthropicApiKey: ""
  googleApiKey: ""
  openaiApiKey: ""
  # Postgres password (only used when postgres.internal=true)
  postgresPassword: "change-me-in-prod"
  postgresUser: "babbage"
  postgresDb: "babbage"
  # Optional MCP API keys
  ncbiApiKey: ""
  ncbiEmail: "ceo@babagemed.com"
  openfdaApiKey: ""
  socrataAppToken: ""
  # Payments — Paddle (Merchant of Record: collects payment + handles tax).
  # Payouts go to a Wise multi-currency account configured in the Paddle
  # dashboard; the owner withdraws Wise → Egypt manually. No Wise API here.
  paddleEnv: "sandbox"          # "sandbox" | "production"
  paddleApiKey: ""              # server-side API key (secret)
  paddleClientToken: ""         # public client-side token for Paddle.js
  paddleWebhookSecret: ""       # webhook signing secret
  paddlePriceGoMonthly: ""      # Paddle price id (pri_…) for GO
  paddlePricePlusMonthly: ""    # …for Plus
  paddlePriceProMonthly: ""     # …for Pro
  paddlePriceMaxMonthly: ""     # …for Max
  # Admin
  bootstrapAdminEmail: ""
  # Scraping
  scraperUserAgent: "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36"
  scraperRateRps: "1"
  scraperProxyUrl: ""

# ─── Desktop auto-updater (Tauri) ────────────────────────────────────────
# Backend route /api/desktop/update/{target}/{arch}/{version} answers
# either 204 (no update) or the Tauri-shaped JSON pointing at the new
# binary + its signature. The manifest can come from three sources;
# pick one. When all three are empty and disabled=false, the endpoint
# silently answers 204 — safe default for fresh deploys.
#
# Production recommendation: publish a `latest.json` as a GitHub release
# asset and set `manifestUrl` to its raw URL. The backend caches it for
# 5 minutes so polling cost is bounded regardless of fleet size.
desktopUpdates:
  enabled: true
  disabled: false        # set true to force-204 even when sources are set
  # Inline JSON (cap a few KB; lives in the backend Secret).
  manifest: ""
  # Remote JSON URL (GitHub Releases asset, S3, etc).
  manifestUrl: ""
  # ConfigMap with the manifest. When configMap.name is set, the chart
  # mounts that ConfigMap into the backend pod and wires
  # DESKTOP_UPDATES_MANIFEST_PATH automatically — you don't need to also
  # set manifestUrl or manifest above. Useful when ops want to update the
  # manifest without a chart upgrade: `kubectl create configmap ... --from-file`.
  configMap:
    name: ""
    key: "latest.json"
    mountPath: "/etc/babbage/desktop-updates"

# ─── Service account ──────────────────────────────────────────────────────
serviceAccount:
  create: true
  name: ""        # auto-generated from release name when empty
  # On GKE/AKS/EKS, annotate with the workload-identity mapping if you use it.
  annotations: {}

# ─── Pod scheduling ───────────────────────────────────────────────────────
nodeSelector: {}
tolerations: []
affinity: {}

# ─── Misc ─────────────────────────────────────────────────────────────────
# Pod-level security. runAsNonRoot is the real guarantee, but it is NOT
# sufficient on its own: GKE Autopilot (Pod-Security "restricted") REJECTS
# a container that sets runAsNonRoot:true when the image's USER is a
# non-numeric NAME, because the kubelet can't resolve the name to a uid at
# admission time → "container has runAsNonRoot and image has non-numeric
# user (node/nonroot), cannot verify user is non-root" → CreateContainerConfigError.
# Our images all use NAME-form USER directives:
#   - frontend (apps/web/Dockerfile) → USER node       = uid 1000
#   - mcps (mcps/*/Dockerfile)       → USER node        = uid 1000
#   - backend (distroless/static)    → USER nonroot     = uid 65532 (overridden in backend.yaml)
# So we MUST pin a NUMERIC runAsUser. The global default below is 1000
# (matching `USER node`, so frontend + all MCPs verify cleanly and still
# bind paths chmod'd for uid 1000 — the thing that broke when 65532 was
# forced globally). The backend Deployment overrides runAsUser to 65532
# to match its distroless nonroot uid. postgres/redis set their own (999).
# seccompProfile RuntimeDefault is the restricted-PSS baseline; without it
# the namespace silently downgrades to "baseline".
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  seccompProfile:
    type: RuntimeDefault
securityContext:
  runAsNonRoot: true
  runAsUser: 1000
  readOnlyRootFilesystem: false   # Playwright needs to write to /tmp
  allowPrivilegeEscalation: false
  capabilities: { drop: ["ALL"] }
  seccompProfile:
    type: RuntimeDefault
