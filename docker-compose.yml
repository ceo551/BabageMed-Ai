name: babagemed
services:
  postgres:
    image: postgres:16-alpine
    container_name: babagemed-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-babagemed}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-babagemed}
      POSTGRES_DB: ${POSTGRES_DB:-babagemed}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-babagemed}"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks: [babagemed]

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: babagemed/backend:latest
    container_name: babagemed-backend
    env_file: .env
    environment:
      PORT: "8080"
      MCP_HOST_OVERRIDE: ""
      DATABASE_URL: ${DATABASE_URL:-postgres://babagemed:babagemed@postgres:5432/babagemed?sslmode=disable}
    ports:
      - "8080:8080"
    restart: unless-stopped
    networks: [babagemed]
    depends_on:
      postgres:
        condition: service_healthy
      mcp-pubmed:
        condition: service_started
      mcp-clinicaltrials:
        condition: service_started
      mcp-fda:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: babagemed/frontend:latest
    container_name: babagemed-frontend
    env_file: .env
    environment:
      BACKEND_URL: http://backend:8080
      NEXT_PUBLIC_API: /api/backend
    ports:
      - "3000:3000"
    restart: unless-stopped
    networks: [babagemed]
    depends_on: [backend]

volumes:
  postgres_data:

networks:
  babagemed:
    name: babagemed
    driver: bridge
